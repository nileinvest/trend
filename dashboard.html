const ATR_PERIOD = 11;
const MULTIPLIER = 3;

const params = new URLSearchParams(window.location.search);
const ticker = params.get('symbol');
const interval = params.get('interval') || '1h';

if (!ticker) {
    document.getElementById('pageTitle').innerText = "Nessun Asset Selezionato";
    showStatus("Seleziona un asset dalla dashboard per visualizzare il grafico.");
} else {
    document.getElementById('pageTitle').innerText = ticker;
    render();
}

async function fetchCandles() {
    const config = SYMBOL_MAP[ticker];
    if (!config) {
        showStatus("Ticker non mappato in SYMBOL_MAP. Aggiungilo nel codice.");
        return null;
    }
    if (config.provider === "crypto") {
        return await fetchBinance(config.symbol, interval);
    } else {
        return await fetchTwelveData(config.symbol, interval);
    }
}

async function fetchBinance(symbol, interval) {
    const binanceInterval = interval === '1day' ? '1d' : interval;
    const url = `https://api.binance.com/api/v3/klines?symbol=${symbol}&interval=${binanceInterval}&limit=300`;
    const res = await fetch(url);
    const raw = await res.json();
    if (!Array.isArray(raw)) { showStatus("Errore Binance: " + JSON.stringify(raw)); return null; }
    return raw.map(k => ({
        time: Math.floor(k[0] / 1000),
        open: parseFloat(k[1]),
        high: parseFloat(k[2]),
        low: parseFloat(k[3]),
        close: parseFloat(k[4])
    }));
}

async function fetchTwelveData(symbol, interval) {
    const tdInterval = interval === '1h' ? '1h' : (interval === '4h' ? '4h' : '1day');
    const url = `https://api.twelvedata.com/time_series?symbol=${encodeURIComponent(symbol)}&interval=${tdInterval}&outputsize=300&apikey=${TWELVE_DATA_API_KEY}`;
    const res = await fetch(url);
    const raw = await res.json();
    if (raw.status === "error" || !raw.values) {
        showStatus("Errore Twelve Data: " + (raw.message || "simbolo non trovato"));
        return null;
    }
    return raw.values.reverse().map(v => ({
        time: Math.floor(new Date(v.datetime + " UTC").getTime() / 1000),
        open: parseFloat(v.open),
        high: parseFloat(v.high),
        low: parseFloat(v.low),
        close: parseFloat(v.close)
    }));
}

function showStatus(msg) {
    document.getElementById('status').innerText = msg;
}

function calculateSupertrend(candles, period, multiplier) {
    const atr = [];
    const trUp = [];
    const trDown = [];
    const supertrend = [];
    let trend = 1;

    for (let i = 0; i < candles.length; i++) {
        const c = candles[i];
        const prev = candles[i - 1];

        let tr;
        if (!prev) {
            tr = c.high - c.low;
        } else {
            tr = Math.max(
                c.high - c.low,
                Math.abs(c.high - prev.close),
                Math.abs(c.low - prev.close)
            );
        }

        if (i < period) {
            atr.push(tr);
        } else {
            const prevAtr = atr[i - 1];
            atr.push((prevAtr * (period - 1) + tr) / period);
        }

        const hl2 = (c.high + c.low) / 2;
        const basicUpper = hl2 + multiplier * atr[i];
        const basicLower = hl2 - multiplier * atr[i];

        const prevFinalUpper = trUp[i - 1] !== undefined ? trUp[i - 1] : basicUpper;
        const prevFinalLower = trDown[i - 1] !== undefined ? trDown[i - 1] : basicLower;

        const finalUpper = (basicUpper < prevFinalUpper || (prev && prev.close > prevFinalUpper)) ? basicUpper : prevFinalUpper;
        const finalLower = (basicLower > prevFinalLower || (prev && prev.close < prevFinalLower)) ? basicLower : prevFinalLower;

        trUp.push(finalUpper);
        trDown.push(finalLower);

        if (i > 0) {
            if (trend === 1 && c.close < finalLower) trend = -1;
            else if (trend === -1 && c.close > finalUpper) trend = 1;
        }

        supertrend.push({
            time: c.time,
            value: trend === 1 ? finalLower : finalUpper,
            trend: trend
        });
    }
    return supertrend;
}

async function render() {
    const candles = await fetchCandles();
    if (!candles || candles.length === 0) return;

    showStatus("");

    const chart = LightweightCharts.createChart(document.getElementById('chartContainer'), {
        layout: { background: { color: '#0f172a' }, textColor: '#e2e8f0' },
        grid: { vertLines: { color: '#1e293b' }, horzLines: { color: '#1e293b' } },
        timeScale: { timeVisible: true, secondsVisible: false },
        rightPriceScale: { borderColor: '#334155' }
    });

    const candleSeries = chart.addCandlestickSeries({
        upColor: '#4ade80', downColor: '#f87171',
        borderVisible: false,
        wickUpColor: '#4ade80', wickDownColor: '#f87171'
    });
    candleSeries.setData(candles);

    const st = calculateSupertrend(candles, ATR_PERIOD, MULTIPLIER);

    const upLine = chart.addLineSeries({ color: '#4ade80', lineWidth: 2 });
    const downLine = chart.addLineSeries({ color: '#f87171', lineWidth: 2 });

    const upData = st.map(p => p.trend === 1 ? { time: p.time, value: p.value } : { time: p.time });
    const downData = st.map(p => p.trend === -1 ? { time: p.time, value: p.value } : { time: p.time });

    upLine.setData(upData);
    downLine.setData(downData);

    chart.timeScale().fitContent();

    window.addEventListener('resize', () => {
        chart.applyOptions({ width: document.getElementById('chartContainer').clientWidth });
    });
}
</script>
